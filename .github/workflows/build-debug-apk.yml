name: Build APK de test

# Se déclenche à chaque push sur main, et peut aussi être lancé manuellement
# depuis l'onglet Actions (bouton "Run workflow").
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Vérifier/compléter le SDK Android
        # Les runners GitHub (ubuntu-latest) embarquent déjà un SDK Android
        # avec licences acceptées. On s'assure juste que la plateforme 36 et
        # les build-tools correspondants sont présents, sans action tierce.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager | head -1)
          fi
          echo "Utilisation de: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compiler l'APK (debug)
        id: build
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
        continue-on-error: true

      - name: Publier l'APK comme fichier téléchargeable
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: afriboost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enregistrer le journal de compilation dans le dépôt (pour diagnostic)
        if: always()
        run: |
          git config user.email "ci@afriboostapp.local"
          git config user.name "AfriBoost CI"
          mkdir -p .ci
          mv build-log.txt .ci/last-build-log.txt
          git add .ci/last-build-log.txt
          git commit -m "CI: journal de compilation [skip ci]" || echo "rien a committer"
          git push origin HEAD:main || echo "push du journal echoue (sans gravite)"

      - name: Échouer le job si la compilation a échoué
        if: steps.build.outcome != 'success'
        run: exit 1
