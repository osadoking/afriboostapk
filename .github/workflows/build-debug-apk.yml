name: Build APK de test

# Se déclenche à chaque push sur main, et peut aussi être lancé manuellement
# depuis l'onglet Actions (bouton "Run workflow").
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compiler l'APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: afriboost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
